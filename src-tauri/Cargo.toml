[package]
name = "desktop-icon-billiards"
version = "0.1.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
base64 = "0.22"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary"] }
base64 = "0.22"

[dependencies.tauri-plugin-single-instance]
version = "2"

[dependencies.tauri-plugin-global-shortcut]
version = "2"

# Keep local builds smaller; rebuild dependencies instead of retaining incremental state.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "symbols"
incremental = false
