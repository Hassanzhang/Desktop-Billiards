<!doctype html>
<html><head><meta charset="utf-8"><title>ball material preview</title>
<style>body{margin:0;background:#0d1210}canvas{display:block}</style></head>
<body>
<canvas id="table"></canvas>
<script type="module">
// Visual harness for the ball material: renders three balls (white, a
// document-icon ball and a Word-icon ball) through the real renderer so
// curvature, print adherence and lighting can be compared side by side.
import { createRenderer } from '../frontend/table-renderer.js';

const makeIcon = draw => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  draw(c.getContext('2d'));
  return c.toDataURL('image/png');
};
const round = (g, x, y, w, h, r, fill) => {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.fillStyle = fill; g.fill();
};
// A generic document icon (transparent surroundings) and a Word-style blue icon.
const docIcon = makeIcon(g => {
  // Denser, macOS-Pages-like document: header bar, many text lines, badge.
  g.fillStyle = '#f7f4ec';
  g.beginPath(); g.moveTo(70, 46); g.lineTo(170, 46); g.lineTo(202, 78); g.lineTo(202, 210);
  g.lineTo(70, 210); g.closePath(); g.fill();
  g.fillStyle = '#cfc7b8'; g.beginPath(); g.moveTo(170, 46); g.lineTo(202, 78); g.lineTo(170, 78); g.closePath(); g.fill();
  g.fillStyle = '#3f6f5e'; g.fillRect(70, 46, 132, 22);
  g.fillStyle = '#f7f4ec'; g.font = '600 15px system-ui'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('Report', 80, 58);
  g.fillStyle = '#b9ae9c';
  [102, 120, 138, 156, 174, 192].forEach((y, i) => g.fillRect(88, y, i % 3 === 2 ? 70 : 96, 7));
  g.fillStyle = '#b52e32'; g.beginPath(); g.arc(176, 184, 18, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = '700 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('A', 176, 185);
});
const wordIcon = makeIcon(g => {
  round(g, 32, 32, 192, 192, 28, '#2b579a');
  g.fillStyle = '#fff'; g.font = '700 120px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('W', 128, 134);
});
const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; });

const [doc, word, frame, matcap] = await Promise.all([
  load(docIcon), load(wordIcon), load('../frontend/assets/table-frame.png'), load('../frontend/assets/ball-matcap.png'),
]);
const width = 1560, height = 600, radius = 136;
const canvas = document.getElementById('table');
canvas.width = width; canvas.height = height;
// Slots 0/2/3 hold white, the document icon and the Word icon (all icon
// balls share the ivory base now); slot 1 is an unused filler hidden via
// sunk so exactly the three test balls show.
const initial = {
  width, height, radius, bounds: [32, 32, width - 32, height - 32],
  pocket_radius: 48, rail_depth: 24, max_pull: 120, black8: 99, guide: false, wallpaper: '',
};
const renderer = createRenderer(canvas, initial, [doc, word, doc], null, frame, null, matcap);
const table = {
  phase: 'rolling',
  // Slots 0/2/3 hold white, blue (Word) and red (document); slot 1 is an
  // unused filler hidden via sunk so exactly the three test balls show.
  xs: [400, 1500, 780, 1160], ys: [300, 1500, 300, 300],
  sunk: [false, true, false, false], guide: [],
  aim: [1, 0], charge: 0, cue_follow: 0, stroke_progress: 0, stroke_origin: [0, 0],
  pocketed: 0, seconds: 0,
};
renderer.draw(table);
// Keep presenting so screenshots taken at any moment catch a drawn frame.
const loop = () => { renderer.draw(table); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
</script>
</body></html>
